# Production stack for the VPS.
#
# First deploy (issues the initial TLS cert, then brings up the full stack):
#   docker/bootstrap-tls.sh your-domain.example.com you@example.com
#
# Every deploy after that:
#   docker compose --env-file .env.production up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_USER: glam
      POSTGRES_DB: glam_delivery
      # POSTGRES_PASSWORD is read from .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glam -d glam_delivery"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed to the host — only reachable by `app` over the compose network.

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    # No host port binding — nginx proxies to it over the compose network.

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Auto-renews every 12h once a cert exists (issued separately by docker/bootstrap-tls.sh).
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"]

  # One-off runner for the Airtable/image migration scripts — shares this compose
  # file's network (so `db` resolves) and mounts the real repo source (the
  # production `app` image doesn't have scripts/ or dev dependencies like tsx).
  # Never started by a plain `up` — only by `docker/run-migration.sh`.
  migrate:
    image: node:22-slim
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Named volume shadows node_modules so `npm ci` in this container never
      # writes back through the bind mount into the real repo directory (which,
      # run from a Mac, would overwrite host-native binaries with Linux ones —
      # this bit us once during testing).
      - migrate_node_modules:/workspace/node_modules
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]

volumes:
  pgdata:
  certbot_www:
  certbot_certs:
  migrate_node_modules:
